# Configuración de Alembic.
# La URL de conexión (sqlalchemy.url) se inyecta en tiempo de ejecución desde
# app.core.config (ver alembic/env.py).

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url se define en env.py a partir de app.core.config.settings
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S