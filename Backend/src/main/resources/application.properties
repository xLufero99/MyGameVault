spring.application.name=backend

# --- Supabase (PostgreSQL) ---
# Las credenciales vienen de variables de entorno (ya sea .env o del sistema).
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=30000&socketTimeout=30000
spring.datasource.username=postgres.${SUPABASE_PROJECT_REF}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# --- JPA / Hibernate ---
# Flyway es dueno del esquema; nunca usar 'update'. Revisar 'validate' cuando existan entidades.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway ---
# Migraciones en src/main/resources/db/migration (V<n>__descripcion.sql).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
