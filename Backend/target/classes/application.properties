spring.application.name=backend

# --- Supabase (PostgreSQL) ---
# Las credenciales vienen de variables de entorno (ya sea .env o del sistema).
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=30000&socketTimeout=30000
spring.datasource.username=postgres.${SUPABASE_PROJECT_REF}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# --- JPA / Hibernate ---
# TEMPORAL (solo desarrollo/prueba): crear la tabla automaticamente para testear la conexion.
# En produccion debe volver a "validate" o "none".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
